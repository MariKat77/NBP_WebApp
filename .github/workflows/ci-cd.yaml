name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # wymagane przez Workload Identity Federation

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  CLUSTER: ${{ vars.GKE_CLUSTER }}
  AR_REPO: ${{ vars.AR_REPOSITORY }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/nbp-webapp
  NAMESPACE: nbp-webapp
  RELEASE: nbp-webapp

jobs:
  test:
    name: Testy i lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements-dev.txt
      - run: pytest app/tests -q
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint helm/nbp-webapp

  build-push:
    name: Build i push obrazu
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3

      # PR: tylko budujemy (walidacja Dockerfile), bez logowania i pushu
      - name: Build (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Auth do GCP (WIF)
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Logowanie do Artifact Registry
        if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build i push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na GKE
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
      - uses: azure/setup-helm@v4

      - name: Helm upgrade --install
        run: |
          helm upgrade --install "$RELEASE" helm/nbp-webapp \
            --namespace "$NAMESPACE" --create-namespace \
            --set image.repository="$IMAGE" \
            --set image.tag="${{ needs.build-push.outputs.tag }}" \
            --atomic --wait --timeout 10m

      - name: Status
        run: |
          kubectl -n "$NAMESPACE" rollout status deploy/"$RELEASE" --timeout=120s
          kubectl -n "$NAMESPACE" get svc,pods
